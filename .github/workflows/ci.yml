name: CI Workflow - Docker

on:
  push:
    branches:
      - main

# Lets the container push the updated index.html back to main
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Step 1: Checks out the repository code to the runner's environment
        uses: actions/checkout@v2

      - name: Build Docker image
        # Step 2: Builds the task-manager image using the Dockerfile in the current directory
        run: docker build -t task-manager:latest .

      - name: Run Docker container
        # Step 3: Runs the container, passing the GitHub username as GITHUB_USER
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" task-manager:latest
